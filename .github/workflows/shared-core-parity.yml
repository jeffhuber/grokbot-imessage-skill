name: Shared Core Parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bin/helper.py"
      - "bin/send_gate.py"
      - "bin/imessage_helper.c"
      - "bin/confirm_imessage_send.m"
      - "shared-core.json"
      - "tools/check_shared_core.py"
      - ".github/workflows/shared-core-parity.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  # Self-check: validates Grok's files against its own manifest on every push
  self-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Grok Bot repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify shared core against local manifest
        run: python3 tools/check_shared_core.py

  # Cross-repo comparison: checks all three siblings for drift (manual and scheduled only)
  compare:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Grok Bot repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grok
          persist-credentials: false
      - name: Check out Claude Cowork repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffhuber/claudecowork-imessage-skill
          path: claude
          persist-credentials: false
      - name: Check out ChatGPT/Codex repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffhuber/chatgpt-codex-imessage-plugin
          path: chatgpt
          persist-credentials: false
      - name: Compare security-critical shared core across siblings
        run: python3 grok/tools/check_shared_core.py claude grok chatgpt
